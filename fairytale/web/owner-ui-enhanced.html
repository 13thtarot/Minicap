<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fairytale Nails Owner Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf8f3;
        --card: #fff;
        --ink: #2e3328;
        --head: #7a6a48;
        --mute: #6f7466;
        --sage: #dde6d2;
        --deep: #4e6240;
        --red: #c43d36;
        --pink: #fbe6e6;
        --beige: #f0ebdc;
        --line: #e8e4d8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1f18;
          --card: #262a21;
          --ink: #eef0e6;
          --head: #d6c79c;
          --mute: #a9ae9c;
          --sage: #2f3a28;
          --deep: #6f8a5a;
          --red: #e8625b;
          --pink: #3a2626;
          --beige: #2d2b21;
          --line: #3a3e32;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1f18;
        --card: #262a21;
        --ink: #eef0e6;
        --head: #d6c79c;
        --mute: #a9ae9c;
        --sage: #2f3a28;
        --deep: #6f8a5a;
        --red: #e8625b;
        --pink: #3a2626;
        --beige: #2d2b21;
        --line: #3a3e32;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.55 Poppins,
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3,
      .ttl {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        color: var(--head);
        margin: 0 0 0.4em;
        line-height: 1.1;
      }
      h1 {
        font-size: clamp(2.4rem, 7vw, 4rem);
      }
      h2 {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }
      h3 {
        font-size: 1.25rem;
      }
      small,
      .mute {
        color: var(--mute);
        font-size: 0.8rem;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 1.1rem;
        background: var(--red);
        color: #fff;
        font-weight: 500;
        cursor: pointer;
      }
      .btn.w {
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line);
      }
      .btn.sm {
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
        border-radius: 8px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--deep);
        outline-offset: 2px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.7rem 1.4rem;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        flex-wrap: wrap;
      }
      .top nav {
        display: flex;
        gap: 1.4rem;
        margin: 0 auto;
      }
      .top nav a {
        cursor: pointer;
        color: var(--ink);
        padding-bottom: 3px;
        border-bottom: 2px solid transparent;
      }
      .top nav a.on {
        border-color: var(--red);
      }
      .logo {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        cursor: pointer;
      }
      .logo i {
        font:
          italic 1.3rem "DM Serif Display",
          serif;
        color: var(--head);
        display: block;
        line-height: 1;
      }
      .logo small {
        font-size: 0.55rem;
        letter-spacing: 0.15em;
        display: block;
      }
      .lg {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--pink);
        display: grid;
        place-items: center;
        font:
          italic 1.3rem "DM Serif Display",
          serif;
        color: var(--red);
      }
      .hero {
        background: var(--sage);
        padding: 3rem 1.4rem;
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
      }
      .two {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 2rem;
        align-items: center;
      }
      .hero h1 em {
        color: var(--red);
      }
      .tag {
        display: inline-block;
        background: var(--card);
        border-radius: 99px;
        padding: 0.25rem 0.8rem;
        font-size: 0.75rem;
        margin-bottom: 1rem;
      }
      .arch {
        width: min(100%, 290px);
        aspect-ratio: 3/4;
        border-radius: 145px 145px 24px 24px;
        background: var(--pink);
        display: grid;
        place-items: center;
        margin-left: auto;
      }
      .bot i {
        display: block;
        width: 34px;
        height: 40px;
        background: #e6c9b4;
        margin: 0 auto;
        border-radius: 6px 6px 0 0;
      }
      .bot b {
        display: grid;
        place-items: center;
        width: 112px;
        height: 122px;
        border-radius: 22px;
        background: linear-gradient(145deg, #f09aa6, #d9708a);
        color: #fff;
        font:
          italic 1.3rem "DM Serif Display",
          serif;
      }
      .sec {
        padding: 3rem 1.4rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 1rem;
      }
      .fav {
        border-radius: 18px;
        padding: 1.2rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        cursor: pointer;
        border: 0;
        text-align: left;
        color: var(--ink);
        width: 100%;
      }
      .fav .ic {
        width: 54px;
        height: 64px;
        border-radius: 27px 27px 10px 10px;
        background: var(--bg);
        display: grid;
        place-items: center;
        color: var(--red);
        font-size: 1.3rem;
        flex: none;
      }
      .band {
        background: var(--deep);
        color: #fff;
        padding: 3rem 1.4rem;
        text-align: center;
      }
      .band h2 {
        color: #fff;
      }
      .steps4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 1.4rem;
        text-align: left;
        margin-top: 2rem;
      }
      .steps4 b {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--pink);
        color: var(--deep);
        font-size: 0.7rem;
      }
      .steps4 h3 {
        color: #fff;
        margin: 0.6rem 0 0.2rem;
        font-size: 1.1rem;
      }
      .steps4 p {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.8;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
        padding: 2rem 1.4rem;
        border-top: 1px solid var(--line);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.1rem;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        margin: 1rem 0;
      }
      .tabs button {
        flex: 1;
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        padding: 0.6rem;
        color: var(--mute);
        cursor: pointer;
      }
      .tabs .on {
        color: var(--ink);
        border-color: var(--ink);
        font-weight: 600;
      }
      .pr {
        color: var(--red);
        font-weight: 600;
      }
      .chips {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.8rem 0;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 99px;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
      }
      .chip.on {
        background: var(--deep);
        color: #fff;
        border-color: var(--deep);
      }
      .chip:disabled {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .opt {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
        text-align: left;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.8rem 1rem;
        margin-bottom: 0.6rem;
        cursor: pointer;
      }
      .opt.on {
        border-color: var(--deep);
        box-shadow: 0 0 0 2px var(--deep);
      }
      .sp {
        display: flex;
        gap: 0.8rem;
        overflow-x: auto;
      }
      .sp button {
        flex: 0 0 120px;
        text-align: center;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.8rem;
        cursor: pointer;
      }
      .sp .on {
        border-color: var(--deep);
        box-shadow: 0 0 0 2px var(--deep);
      }
      .av {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        margin: 0 auto 0.3rem;
        display: grid;
        place-items: center;
        background: var(--pink);
        color: var(--deep);
        font-weight: 600;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
        max-width: 360px;
      }
      .cal b {
        font-size: 0.75rem;
        color: var(--mute);
      }
      .cal button {
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--ink);
        cursor: pointer;
      }
      .cal .on {
        background: var(--red);
        color: #fff;
      }
      .cal button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      label {
        display: block;
        margin: 0.7rem 0 0.2rem;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
      }
      .msg {
        padding: 0.6rem 0.9rem;
        border-radius: 10px;
        margin: 0.7rem 0;
        background: var(--pink);
        color: var(--red);
      }
      .ok {
        background: var(--sage);
        color: var(--deep);
      }
      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .shell {
        display: grid;
        grid-template-columns: 210px 1fr;
        min-height: 100vh;
      }
      aside {
        background: color-mix(in srgb, var(--sage) 40%, var(--bg));
        border-right: 1px solid var(--line);
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      aside .nv {
        padding: 0.5rem 0.7rem;
        border-radius: 8px;
        cursor: pointer;
      }
      aside .nv.on {
        background: var(--card);
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--line);
      }
      aside .me {
        margin-top: auto;
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .pad {
        padding: 1.5rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 1rem;
        margin: 1.2rem 0;
      }
      .stat b {
        font-size: 1.7rem;
        display: block;
        line-height: 1.2;
      }
      .stat.dk {
        background: var(--deep);
        color: #fff;
        border: 0;
      }
      .stat.dk small {
        color: #dfe8d4;
      }
      .tbl {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 620px;
      }
      th {
        background: var(--bg);
        color: var(--mute);
        font-weight: 400;
        font-size: 0.75rem;
      }
      td,
      th {
        padding: 0.6rem 0.7rem;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 0.82rem;
      }
      .pill {
        border-radius: 99px;
        padding: 0.15rem 0.6rem;
        font-size: 0.72rem;
        font-weight: 500;
        background: var(--pink);
        color: var(--red);
      }
      .pill.service,
      .pill.completed {
        background: var(--sage);
        color: var(--deep);
      }
      .pill.pending,
      .pill.waiting {
        background: var(--beige);
        color: var(--head);
      }
      .seg {
        display: flex;
        gap: 6px;
      }
      .seg i {
        height: 7px;
        flex: 1;
        max-width: 60px;
        border-radius: 9px;
        background: var(--line);
      }
      .seg i.f {
        background: var(--deep);
      }
      .g2 {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 170px;
      }
      .chart i {
        flex: 1;
        background: var(--deep);
        border-radius: 3px 3px 0 0;
        opacity: 0.85;
      }
      .chart i.lo {
        background: var(--red);
      }
      .heat {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
      }
      .heat i {
        height: 44px;
        border-radius: 6px;
        background: var(--deep);
      }

      @media (max-width: 760px) {
        .two,
        .g2 {
          grid-template-columns: 1fr;
        }
        .arch {
          margin: 0;
        }
        .shell {
          grid-template-columns: 1fr;
        }
        aside {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
        }
        aside .me {
          display: none;
        }
      }
      .btn.o {
        background: none;
        color: var(--red);
        box-shadow: inset 0 0 0 1px var(--red);
      }
      .tag {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      .ph {
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        background: var(--beige);
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .ph span {
        position: absolute;
        left: 10px;
        bottom: 10px;
        background: rgba(255, 255, 255, 0.93);
        color: #2a2a2a;
        border-radius: 99px;
        padding: 0.18rem 0.7rem;
        font-size: 0.7rem;
        font-weight: 500;
      }
      .hp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      .hp > div {
        display: grid;
        gap: 14px;
      }
      .hp > div + div {
        margin-top: 44px;
      }
      .t1 {
        aspect-ratio: 271/320;
      }
      .t3 {
        aspect-ratio: 271/230;
      }
      .gal {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        align-items: start;
      }
      .ph.a {
        aspect-ratio: 361/246;
      }
      .ph.b {
        aspect-ratio: 361/213;
        margin-top: 17px;
      }
      .ph.c {
        aspect-ratio: 361/214;
      }
      @media (max-width: 760px) {
        .gal {
          grid-template-columns: repeat(2, 1fr);
        }
        .ph.b {
          margin-top: 0;
        }
        .hp {
          margin-top: 1rem;
        }
      }
      .mb {
        position: fixed;
        inset: 0;
        background: #0007;
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 1rem;
      }
      .mc {
        background: var(--card);
        color: var(--ink);
        border-radius: 16px;
        padding: 1.4rem;
        width: min(460px, 100%);
        max-height: 90vh;
        overflow: auto;
      }
      .mc.rc {
        width: 340px;
      }
      .mc hr {
        border: 0;
        border-top: 1px dashed var(--line);
        margin: 0.7rem 0;
      }
      .mc h3 {
        margin-bottom: 0.5rem;
      }
      textarea {
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .pill.noshow,
      .pill.cancelled,
      .pill.expired,
      .pill.refunded {
        background: var(--pink);
        color: var(--red);
      }
      @media print {
        .noprint,
        header.top,
        .foot {
          display: none !important;
        }
        .shell {
          display: block;
        }
        body.rcp #app {
          display: none;
        }
        body.rcp .mb {
          position: static;
          background: none;
        }
        body {
          background: #fff;
          padding: 0;
        }
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #33362e;
        color: #fff;
        border-radius: 99px;
        padding: 0.6rem 1.2rem;
        z-index: 30;
      }
      .pill.voided {
        background: var(--pink);
        color: var(--red);
      }
    
      /* Additional service-preview and sign-in styling from the updated owner design. */
      .svt { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; display: block; background: var(--beige); }
      .svr { display: flex; gap: .8rem; align-items: center; min-width: 0; }
      .svr > span { min-width: 0; }
      .auth { padding: 1.6rem; }
      .auth h2 { margin-top: 0; }
      .pwrow { position: relative; }
      .pwrow input { padding-right: 4.6rem; }
      .pwrow .eye { position:absolute; right:.35rem; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--deep); font-weight:600; cursor:pointer; padding:.4rem .6rem; }

    </style>
  </head>
  <body>
    <script src="./js/loader.js"></script>
    <div id="app"></div>
    <div id="md"></div>
    <script>window.FNready = new Promise((r) => (window.__fnReady = r));</script>
    <script type="module">
      import * as auth from "./js/auth.js";
      import { loadCatalog } from "./js/catalog.js";
      import * as owner from "./js/owner.js";
      import { watchOwnerBoard } from "./js/realtime.js";
      // Loader.wrap() puts the loading screen in front of EVERY async call (FN.raw = same calls, silent).
      window.FN = (window.Loader ? Loader.wrap : (x) => x)({ ...auth, ...owner, loadCatalog, watchOwnerBoard });
      window.__fnReady();
    </script>
    <script>
      const $ = (q) => document.querySelector(q),
        php = (n) => "₱" + Math.round(n).toLocaleString(),
        pad = (n) => String(n).padStart(2, "0"),
        fmt = (d) =>
          d.getFullYear() +
          "-" +
          pad(d.getMonth() + 1) +
          "-" +
          pad(d.getDate()),
        today = () => fmt(new Date()),
        esc = (s) =>
          String(s ?? "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;"),
        key = (a) => a.date + String(a.start).padStart(4, "0");
      const m2t = (m) => {
        const h = Math.floor(m / 60);
        return (h % 12 || 12) + ":" + pad(m % 60) + (h < 12 ? " AM" : " PM");
      };
      const durT = (m) =>
        m >= 60
          ? +(m / 60).toFixed(2) + (m === 60 ? " hr" : " hrs")
          : m + " min";

      const hsl = (h, s, l) => {
        s /= 100; l /= 100;
        const a = s * Math.min(l, 1 - l);
        const f = n => {
          const k = (n + h / 30) % 12;
          const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
          return Math.round(255 * c).toString(16).padStart(2, "0");
        };
        return "#" + f(0) + f(8) + f(4);
      };
      const svgArt = (s) => {
        const n = String(s.n || ""), g = String(s.g || "");
        const hue = (n.length * 37 + g.length * 11 + (Number(s.id) || 0) * 17) % 360;
        const colors = [
          hsl(hue, 68, 76), hsl((hue + 35) % 360, 62, 70),
          hsl((hue + 320) % 360, 58, 82), hsl((hue + 70) % 360, 55, 74),
          hsl((hue + 200) % 360, 50, 80)
        ];
        const bg = hsl(hue, 45, 94), skin = "#f2cdb8";
        const isGel = /Gel|BIAB|Soft|Luxury|Glam|Self-Care|Pamper/i.test(n);
        const isExtension = /Extension|BIAB|Luxury/i.test(n);
        const isFoot = /Pedi|Footspa/i.test(n) && !/Mani/i.test(n);
        const isRemoval = g === "Removal" || /Remov/i.test(n);
        const isKids = /Kids/i.test(n);
        const isPackage = g === "Packages" || /\+/.test(n);
        const star = (x, y, r) =>

          FINK = "";
          if (P === "rep") { try { const k = RG.f + "|" + RG.t; FIN = await (FN.raw || FN).dashboard(RG.f, RG.t); FINK = k; } catch (e) {} }
          if (OW && !$("#md").innerHTML && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) render();
        });
      }
      async function boot() {
        $("#app").innerHTML = ""; // the loading screen is already covering the page
        try {
          if ((await FN.currentUser()) && (await FN.requirePortalRole("owner"))) await afterLogin();
        } catch (e) {
          console.error(e);
          $("#app").innerHTML = '<p style="text-align:center;padding:5rem 1rem">Could not reach the salon system. <a class="pr" style="cursor:pointer" onclick="boot()">Try again</a></p>';
          window.Loader && Loader.endInitial();
          return;
        }
        render();
        window.Loader && Loader.endInitial(); // reveal only after the first screen is fully rendered
      }
      async function loadFin() {
        const k = RG.f + "|" + RG.t;
        try { const d = await FN.dashboard(RG.f, RG.t); if (FINK === k) FIN = d; } catch (e) { if (FINK === k) FIN = { error: e.message }; }
        if (FINK === k && P === "rep" && !$("#md").innerHTML) render();
      }
      function finReload() { FINK = ""; render(); }
      function finCard() {
        const k = RG.f + "|" + RG.t;
        if (FINK !== k) { FINK = k; FIN = null; loadFin(); }
        if (!FIN) return '<div class="card" style="margin-bottom:1rem"><small>Loading financial summary...</small></div>';
        if (FIN.error) return `<div class="card" style="margin-bottom:1rem"><div class="msg">${esc(FIN.error)}</div></div>`;
        const net = +FIN.deposits_received + +FIN.balance_payments - +FIN.refunds,
          box = (l, v, n) => `<div class="card stat"><small>${l}</small><b>${php(v)}</b>${n ? `<small>${n}</small>` : ""}</div>`;
        const meth = Object.entries(FIN.by_method || {}).map(([m, v]) => `<div class="row"><span>${esc(m)}</span><b>${php(v)}</b></div>`).join("") || '<small>No payments in this range.</small>';
        return `<div class="stats" style="margin-bottom:1rem">${box("Net collected", net, "deposits + balances − refunds")}${box("Sales total", FIN.sales_total, FIN.completed_sales + " completed sales, incl. tax")}${box("Deposits received", FIN.deposits_received, "")}${box("Balance payments", FIN.balance_payments, "")}${box("Refunds", FIN.refunds, "")}${box("Outstanding balances", FIN.outstanding_balance, "unpaid open invoices")}${box("Forfeited deposits", FIN.forfeited_deposits, "cancelled / no-show")}${box("Tax collected", FIN.tax_collected, "")}</div><div class="card" style="margin-bottom:1rem"><b>Payments by method</b>${meth}</div>`;
      }
      FNready.then(boot);
    </script>
  </body>
</html>
